services:
  - type: web
    name: booking-gor
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js  # <-- WAJIB ditambahkan agar server bisa nyala
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-gor-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: booking-gor-db
    plan: free
    region: singapore # <-- Biar dekat dengan Indonesia dan jalannya cepat