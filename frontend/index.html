<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOR Futsal Arena - Booking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 60px;
        }

        .nav-tab {
            flex: 1;
            padding: 14px 24px;
            border: none;
            background: transparent;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s;
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .time-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-card.available:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .time-card.booked {
            background: #fee2e2;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .court-tabs {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .court-tab {
            padding: 10px 20px;
            background: #f3f4f6;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .court-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .form-control {
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            width: 100%;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            display: none;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid white;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f3f4f6;
        }

        .badge-success {
            background: #10b981;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge-warning {
            background: #f59e0b;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="app-container">
        <div class="header">
            <div class="logo">
                <h1><i class="fas fa-futbol"></i> GOR Futsal Arena</h1>
            </div>
            <div id="userInfo">
                <button class="btn" id="loginBtn">Login</button>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" data-section="booking">Booking</button>
            <button class="nav-tab" data-section="transactions">Transaksi</button>
            <button class="nav-tab" data-section="dashboard" id="dashboardTab" style="display:none">Dashboard</button>
        </div>

        <div class="section active" id="bookingSection">
            <div class="card">
                <h3>Pilih Tanggal & Lapangan</h3>
                <input type="date" id="bookingDate" class="form-control" style="margin: 15px 0;">
                <div id="courtTabs" class="court-tabs"></div>
                <div id="scheduleContainer"></div>
            </div>
        </div>

        <div class="section" id="transactionsSection">
            <div class="card">
                <h3>Riwayat Transaksi</h3>
                <div id="transactionsList"></div>
            </div>
        </div>

        <div class="section" id="dashboardSection">
            <div class="card">
                <h3>Dashboard Analytics</h3>
                <div id="analyticsContent"></div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL
        const API_BASE = '/api';
        let currentUser = null;
        let selectedDate = new Date().toISOString().split('T')[0];

        // Helper functions
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        async function apiRequest(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Terjadi kesalahan');
            }
            return data;
        }

        // Auth functions
        async function login(email, password) {
            showLoading();
            try {
                const data = await apiRequest('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                localStorage.setItem('token', data.data.token);
                localStorage.setItem('user', JSON.stringify(data.data.user));
                currentUser = data.data.user;
                renderUserInfo();
                return true;
            } catch (error) {
                alert(error.message);
                return false;
            } finally {
                hideLoading();
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            currentUser = null;
            renderUserInfo();
            location.reload();
        }

        function renderUserInfo() {
            const userInfo = document.getElementById('userInfo');
            if (currentUser) {
                userInfo.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span><i class="fas fa-user"></i> ${currentUser.name}</span>
                        <button class="btn" onclick="logout()">Logout</button>
                    </div>
                `;
                if (currentUser.isAdmin) {
                    document.getElementById('dashboardTab').style.display = 'block';
                }
            } else {
                userInfo.innerHTML = `
                    <button class="btn btn-primary" onclick="showLoginModal()">Login / Register</button>
                `;
            }
        }

        function showLoginModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Login</h3>
                    <input type="email" id="loginEmail" placeholder="Email" class="form-control" style="margin: 10px 0;">
                    <input type="password" id="loginPassword" placeholder="Password" class="form-control" style="margin: 10px 0;">
                    <button class="btn btn-primary" onclick="handleLogin()" style="margin-right: 10px;">Login</button>
                    <button class="btn" onclick="showRegisterModal()">Register</button>
                    <button class="btn" onclick="this.closest('.modal').remove()">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showRegisterModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Register</h3>
                    <input type="text" id="regName" placeholder="Nama" class="form-control" style="margin: 10px 0;">
                    <input type="email" id="regEmail" placeholder="Email" class="form-control" style="margin: 10px 0;">
                    <input type="tel" id="regPhone" placeholder="No. Telepon" class="form-control" style="margin: 10px 0;">
                    <input type="password" id="regPassword" placeholder="Password" class="form-control" style="margin: 10px 0;">
                    <button class="btn btn-primary" onclick="handleRegister()" style="margin-right: 10px;">Register</button>
                    <button class="btn" onclick="showLoginModal()">Back to Login</button>
                    <button class="btn" onclick="this.closest('.modal').remove()">Close</button>
                </div>
            `;
            document.querySelector('.modal')?.remove();
            document.body.appendChild(modal);
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const success = await login(email, password);
            if (success) {
                document.querySelector('.modal')?.remove();
                await loadSchedule();
                await loadTransactions();
            }
        }

        async function handleRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;

            showLoading();
            try {
                await apiRequest('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, email, phone, password })
                });
                alert('Registrasi berhasil! Silakan login.');
                showLoginModal();
            } catch (error) {
                alert(error.message);
            } finally {
                hideLoading();
            }
        }

        // Booking functions
        async function loadSchedule() {
            showLoading();
            try {
                const courts = [1, 2, 3];
                const scheduleContainer = document.getElementById('scheduleContainer');
                const courtTabsDiv = document.getElementById('courtTabs');
                
                scheduleContainer.innerHTML = '';
                courtTabsDiv.innerHTML = '';
                
                for (let i = 0; i < courts.length; i++) {
                    const courtId = courts[i];
                    const data = await apiRequest(`/bookings/slots?date=${selectedDate}&courtId=${courtId}`);
                    
                    const scheduleDiv = document.createElement('div');
                    scheduleDiv.className = 'schedule-grid';
                    scheduleDiv.id = `court-${courtId}`;
                    scheduleDiv.style.display = i === 0 ? 'grid' : 'none';
                    
                    data.data.slots.forEach(slot => {
                        const card = document.createElement('div');
                        card.className = `time-card ${slot.available ? 'available' : 'booked'}`;
                        card.innerHTML = `
                            <div>${slot.time}</div>
                            <div style="font-size: 12px;">${slot.available ? 'Tersedia' : 'Terisi'}</div>
                        `;
                        if (slot.available) {
                            card.onclick = () => showBookingModal(courtId, slot.time);
                        }
                        scheduleDiv.appendChild(card);
                    });
                    
                    scheduleContainer.appendChild(scheduleDiv);
                    
                    const tab = document.createElement('button');
                    tab.className = i === 0 ? 'court-tab active' : 'court-tab';
                    tab.textContent = `Lapangan ${courtId}`;
                    tab.onclick = () => {
                        document.querySelectorAll('[id^="court-"]').forEach(el => el.style.display = 'none');
                        scheduleDiv.style.display = 'grid';
                        document.querySelectorAll('.court-tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                    };
                    courtTabsDiv.appendChild(tab);
                }
            } catch (error) {
                console.error(error);
                document.getElementById('scheduleContainer').innerHTML = '<p>Gagal memuat jadwal</p>';
            } finally {
                hideLoading();
            }
        }

        function showBookingModal(courtId, startTime) {
            if (!currentUser) {
                alert('Silakan login terlebih dahulu');
                showLoginModal();
                return;
            }
            
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Booking Lapangan ${courtId}</h3>
                    <p>Tanggal: ${selectedDate}</p>
                    <p>Jam: ${startTime}</p>
                    <input type="text" id="customerName" placeholder="Nama Lengkap" value="${currentUser.name}" class="form-control" style="margin: 10px 0;">
                    <input type="tel" id="customerPhone" placeholder="No. Telepon" value="${currentUser.phone || ''}" class="form-control" style="margin: 10px 0;">
                    <select id="duration" class="form-control" style="margin: 10px 0;">
                        <option value="1">1 jam - Rp 50.000</option>
                        <option value="2">2 jam - Rp 100.000</option>
                        <option value="3">3 jam - Rp 150.000</option>
                        <option value="4">4 jam - Rp 200.000</option>
                    </select>
                    <div style="margin: 10px 0;">
                        <label>
                            <input type="checkbox" id="isMember"> Member (Diskon Rp 10.000)
                        </label>
                    </div>
                    <button class="btn btn-primary" onclick="confirmBooking(${courtId}, '${startTime}')">Konfirmasi Booking</button>
                    <button class="btn" onclick="this.closest('.modal').remove()">Batal</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        async function confirmBooking(courtId, startTime) {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const duration = parseInt(document.getElementById('duration').value);
            const isMember = document.getElementById('isMember').checked;
            
            const startHour = parseInt(startTime.split(':')[0]);
            const endHour = startHour + duration;
            const endTime = `${endHour.toString().padStart(2, '0')}:00`;
            
            showLoading();
            try {
                const result = await apiRequest('/bookings', {
                    method: 'POST',
                    body: JSON.stringify({
                        courtId,
                        date: selectedDate,
                        startTime,
                        endTime,
                        customerName: name,
                        customerPhone: phone,
                        isMember
                    })
                });
                
                alert(`Booking berhasil! Total: Rp ${result.data.price.total.toLocaleString('id-ID')}`);
                document.querySelector('.modal').remove();
                await loadSchedule();
                await loadTransactions();
            } catch (error) {
                alert(error.message);
            } finally {
                hideLoading();
            }
        }

        async function loadTransactions() {
            try {
                const result = await apiRequest('/transactions');
                const transactionsList = document.getElementById('transactionsList');
                
                if (result.data && result.data.length > 0) {
                    transactionsList.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Lapangan</th>
                                    <th>Tanggal</th>
                                    <th>Jam</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${result.data.map(trx => `
                                    <tr>
                                        <td>${trx.id.substring(0, 8)}</td>
                                        <td>Lapangan ${trx.court}</td>
                                        <td>${trx.dateStr}</td>
                                        <td>${trx.startVal} - ${trx.endVal}</td>
                                        <td>Rp ${parseInt(trx.totalVal).toLocaleString('id-ID')}</td>
                                        <td><span class="${trx.status === 'Lunas' ? 'badge-success' : 'badge-warning'}">${trx.status}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    transactionsList.innerHTML = '<p>Belum ada transaksi</p>';
                }
            } catch (error) {
                document.getElementById('transactionsList').innerHTML = '<p>Gagal memuat transaksi</p>';
            }
        }

        async function loadDashboard() {
            try {
                const result = await apiRequest('/analytics');
                const analyticsContent = document.getElementById('analyticsContent');
                const totalRevenue = result.data.reduce((sum, item) => sum + parseFloat(item.total_revenue), 0);
                const totalBookings = result.data.reduce((sum, item) => sum + item.regular_bookings_count + item.membership_bookings_count, 0);
                
                analyticsContent.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                        <div style="background: #f3f4f6; padding: 20px; border-radius: 12px;">
                            <h4>Total Revenue</h4>
                            <p style="font-size: 24px; font-weight: bold;">Rp ${totalRevenue.toLocaleString('id-ID')}</p>
                        </div>
                        <div style="background: #f3f4f6; padding: 20px; border-radius: 12px;">
                            <h4>Total Bookings</h4>
                            <p style="font-size: 24px; font-weight: bold;">${totalBookings}</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
            }
        }

        // Navigation
        function setupNavigation() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const section = tab.dataset.section;
                    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                    document.getElementById(`${section}Section`).classList.add('active');
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    if (section === 'transactions') loadTransactions();
                    if (section === 'dashboard') loadDashboard();
                });
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                renderUserInfo();
            }
            
            document.getElementById('bookingDate').value = selectedDate;
            document.getElementById('bookingDate').addEventListener('change', (e) => {
                selectedDate = e.target.value;
                loadSchedule();
            });
            
            setupNavigation();
            await loadSchedule();
            await loadTransactions();
            
            if (currentUser?.isAdmin) {
                await loadDashboard();
            }
        });

        // Expose functions to global
        window.login = login;
        window.logout = logout;
        window.showLoginModal = showLoginModal;
        window.showRegisterModal = showRegisterModal;
        window.handleLogin = handleLogin;
        window.handleRegister = handleRegister;
        window.confirmBooking = confirmBooking;
    </script>
</body>
</html>
